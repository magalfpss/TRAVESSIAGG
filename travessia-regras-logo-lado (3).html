.layout{display:flex;min-height:100vh}.side{width:260px;background:rgba(3,12,22,.94);border-right:1px solid var(--line);padding:24px;position:sticky;top:0;height:100vh;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:1000;letter-spacing:1px;margin-bottom:35px;font-family:Impact,'Arial Black',sans-serif;color:#fff;text-shadow:3px 3px 0 #07111b}.logo img{width:58px;height:58px;object-fit:cover;object-position:center;border-radius:12px;border:2px solid rgba(255,255,255,.28);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.nav-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:9px;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:var(--panel2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
main{width:100%;max-width:950px;margin:0 auto;padding:48px 38px}.crumb{color:#9ed5ff;font-size:12px;font-weight:800;letter-spacing:1.5px}.hero{margin-top:18px;padding:34px;border:1px solid var(--line);border-radius:20px;background:rgba(5,15,26,.82);backdrop-filter:blur(8px);box-shadow:0 18px 60px rgba(0,0,0,.25)}h1{font-size:clamp(30px,5vw,50px);margin:0 0 15px}h2{margin-top:35px;font-size:25px}p{line-height:1.8;color:var(--muted)}.notice{margin-top:25px;padding:18px;border:1px solid rgba(117,183,235,.55);background:rgba(16,42,64,.85);border-radius:12px}.notice strong{color:#dff2ff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px}.card{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:white;text-align:left;cursor:pointer}.card:hover{border-color:var(--accent);transform:translateY(-2px)}.card b{display:block;margin:12px 0 6px}.card small{color:var(--muted);line-height:1.5}.rule{padding:20px;margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(5px)}.tag{display:inline-block;background:var(--panel2);color:#bfe5ff;font-size:11px;font-weight:800;padding:5px 8px;border-radius:5px;margin-bottom:10px}.back{background:var(--panel2);border:1px solid var(--line);color:white;padding:10px 14px;border-radius:8px;cursor:pointer}.footer{margin-top:45px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:700px){.layout{display:block}.side{width:100%;height:auto;position:static;padding:18px}.logo{margin-bottom:15px}.nav{display:flex;gap:5px;overflow:auto}.nav-title{display:none}.nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:1fr}main{padding:28px 18px}.hero{padding:24px}}
</style>

<script>
const data={
gerais:['Regras gerais','Normas de convivência e funcionamento do servidor.',[['01','Respeito','Respeite todos os jogadores, membros da equipe e participantes do servidor.'],['02','Cumprimento','Todos devem conhecer e cumprir o regulamento vigente.'],['03','Administração','Siga as orientações da equipe responsável.'],['04','Atualizações','Consulte o livro regularmente para acompanhar alterações.']]],
rp:['Regras de Roleplay','Princípios para manter a imersão e a qualidade das situações de RP.',[['01','Imersão','Mantenha a coerência das ações e respeite a experiência dos demais jogadores.'],['02','Conduta','Evite atitudes que quebrem a experiência de roleplay.'],['03','Situações','Siga as regras específicas de cada situação.'],['04','Conflitos','Resolva conflitos conforme o regulamento e use o suporte.']]],
policia:['Regras policiais','Procedimentos e normas da polícia do servidor.',[['01','Conduta policial','Mantenha postura profissional e respeitosa durante o serviço.'],['02','Abordagens','Realize abordagens conforme os procedimentos oficiais.'],['03','Equipamentos','Utilize recursos policiais de acordo com as autorizações.'],['04','Hierarquia','Respeite a cadeia de comando da corporação.']]],
punicoes:['Punições','Infrações e medidas administrativas.',[['01','Advertências','Infrações podem resultar em advertências conforme a gravidade.'],['02','Suspensões','Punições podem ser aplicadas conforme o regulamento.'],['03','Análise','Os casos serão avaliados de acordo com provas e normas.'],['04','Recurso','Procure o suporte oficial em caso de dúvidas ou contestação.']]]
};
function home(){return `<div class="crumb">TRAVESSIA ROLEPLAY</div><section class="hero"><h1>Livro de Regras</h1><p>Bem-vindo à documentação oficial do servidor TRAVESSIA. Consulte as regras para garantir uma experiência de roleplay organizada, justa e divertida.</p><div class="notice"><strong>⚠ Aviso importante</strong><p>O descumprimento das regras poderá resultar em punições. Atente-se a todas as regras antes de jogar.</p></div></section><h2>Explore as regras</h2><p>Selecione uma categoria para consultar suas regras.</p><div class="cards">${[['gerais','▣','Regras gerais','Normas de convivência e funcionamento.'],['rp','◈','Regras de Roleplay','Princípios de RP e imersão.'],['policia','♜','Regras policiais','Procedimentos e conduta policial.'],['punicoes','⚖','Punições','Infrações e medidas administrativas.']].map(x=>`<button class="card" onclick="show('${x[0]}')"><div>${x[1]}</div><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`}
function show(key,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let html;if(key==='home')html=home();else{let p=data[key];html=`<button class="back" onclick="show('home')">← Início</button><div class="crumb" style="margin-top:28px">${p[0].toUpperCase()}</div><h1 style="margin-top:12px">${p[0]}</h1><p>${p[1]}</p><div class="notice"><strong>ℹ Importante</strong><p>Confira sempre a versão oficial e as orientações da administração.</p></div><h2>Regulamento</h2>${p[2].map(r=>`<div class="rule"><span class="tag">REGRA ${r[0]}</span><b>${r[1]}</b><p>${r[2]}</p></div>`).join('')}`};document.getElementById('content').innerHTML=html+'<div class="footer">TRAVESSIA © Livro de Regras · Versão 1.0</div>'}
show('home');
</script>
